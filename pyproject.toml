[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(\.git|\.venv|\.mypy_cache|\.pytest_cache|build|dist|\.eggs|\.idea|\.vscode|logs|log-[^/]+|wandb|checkpoints|outputs|\.ipynb_checkpoints)
'''

[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
known_first_party = ["sleep2vec", "sleep2vec2", "sleep2expert", "agent_tools", "sleep2stat"]
combine_as_imports = true
force_sort_within_sections = true
skip_gitignore = true

# All agent_tools modules are checked. utils/type_check.py rejects global and
# per-module ignore_errors settings so type-check debt cannot be reintroduced.
[tool.mypy]
python_version = "3.10"
files = ["agent_tools"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party dependencies intentionally absent or untyped in the lightweight
# type-check environment. Suppression is scoped to exactly these so that an
# unresolvable agent_tools-local import stays a hard error. wandb and torch are
# lazy runtime imports, but mypy still resolves them while checking their callers.
module = ["yaml.*", "pandas.*", "wandb.*", "torch.*"]
ignore_missing_imports = true
