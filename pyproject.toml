[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(\.git|\.venv|\.mypy_cache|\.pytest_cache|build|dist|\.eggs|\.idea|\.vscode|logs|log-[^/]+|wandb|checkpoints|outputs|\.ipynb_checkpoints)
'''

[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
known_first_party = ["sleep2vec", "sleep2vec2", "sleep2expert", "agent_tools", "sleep2stat"]
combine_as_imports = true
force_sort_within_sections = true
skip_gitignore = true

# agent_tools carries ~99% return-type annotation coverage that nothing verified
# before this config existed. Rather than block on the ~920 pre-existing errors,
# mypy runs as a ratchet: every module below is grandfathered out, everything
# else -- including every newly added module -- is checked. The list is a debt
# ledger that may only shrink. CI re-runs mypy with the ledger disabled and
# fails on any entry that no longer has errors, so a module cannot stay
# grandfathered after it has been cleaned up (see .github/workflows/style_check.yml).
[tool.mypy]
python_version = "3.10"
files = ["agent_tools"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party dependencies intentionally absent or untyped in the lightweight
# type-check environment. Suppression is scoped to exactly these so that an
# unresolvable agent_tools-local import stays a hard error. wandb and torch are
# lazy runtime imports, but mypy still resolves them while checking their callers.
module = ["yaml.*", "pandas.*", "wandb.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Grandfathered debt ledger -- shrink, never grow. To remove an entry, fix the
# module's errors and delete its line. The list reflects the type-check job's
# environment (requirements-agent-tools.txt); a fuller local environment can
# surface extra errors from third-party stubs that CI does not install.
ignore_errors = true
module = [
    "agent_tools.adapters.finetune",
    "agent_tools.adapters.hparam_tune",
    "agent_tools.adapters.preset_prepare",
    "agent_tools.adapters.sleep2stat",
    "agent_tools.adaptive_hparam",
    "agent_tools.decision_hparam",
    "agent_tools.domain.finetune_hparam_profile",
    "agent_tools.domain.finetune_summary",
    "agent_tools.domain.index_csv",
    "agent_tools.domain.sidecar_summaries",
    "agent_tools.experiment_tracking",
    "agent_tools.experiments",
    "agent_tools.hparam_postprocess",
    "agent_tools.hparam_runtime",
    "agent_tools.hparam_selection",
    "agent_tools.managed_scheduler",
    "agent_tools.plan_hparam",
    "agent_tools.plans",
]
