minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: .githooks/pre-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
