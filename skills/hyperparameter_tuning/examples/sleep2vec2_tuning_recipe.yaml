name: sleep2vec2_tuning_example
task: hparam_tune
variant: sleep2vec2
experiment:
  id: ASK_USER
  title: ASK_USER
  objective: ASK_USER
  root: ASK_USER
  baseline: ASK_USER
step:
  id: tune-sleep2vec2-test
  phase: train
  purpose: Tune sleep2vec2 using test selection.
base_recipe: recipes/templates/finetune_sleep2vec2_ppg_ahi.yaml
# Starting example only: adjust the axes and points to the actual
# base/runtime config, prior evidence and compute authority before planning.
search:
  method: grid
  max_runs: 2
  # Exact points this plan runs: complete and unique.
  configurations:
    - runtime.lr: 1.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1
    - runtime.lr: 3.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1

evaluation_policy:
  selection_metric: test_ahi_pearson
  selection_mode: max
  selection_split: test
  external_test_locked: false
  test_after_fit: true
  final_eval_split: test
  final_test_unlocked: false
  require_manual_unlock_for_final_test: true
