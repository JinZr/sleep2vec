name: sleep2vec2_ppg_ahi_val_tuning_example
task: hparam_tune
variant: sleep2vec2

experiment:
  id: ASK_USER
  title: ASK_USER
  objective: ASK_USER
  root: ASK_USER
  baseline: ASK_USER
step:
  id: ASK_USER
  phase: train
  purpose: ASK_USER

base_recipe: finetune_sleep2vec2_ppg_ahi.yaml

# Starting example only: adjust axes, bounds and first points to the actual
# base/runtime config, prior evidence and compute authority before initialization.
search:
  method: grid
  max_runs: 2
  parameters:
    runtime.lr: [1.0e-6, 3.0e-6]
    runtime.weight_decay: [1.0e-5]
    runtime.epochs: [30]
    yaml:/model/head/dropout: [0.1]
  # Exact opening points; the domain above and bounds below remain available later.
  configurations:
    - runtime.lr: 1.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1
    - runtime.lr: 3.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1

adaptive:
  enabled: true
  objective_metric: val_ahi_pearson
  objective_mode: max
  round_size: 2
  max_rounds: 6
  max_runs_total: 12
  test_feedback_for_selection: false
  replacement:
    enabled: false
  suggest:
    strategy: agent_proposal
    bounds:
      runtime.lr: [1.0e-7, 1.0e-4]
      runtime.weight_decay: [0.0, 1.0e-3]
      runtime.epochs: [15, 60]
      yaml:/model/head/dropout: [0.0, 0.3]

artifacts:
  overwrite: false

evaluation_policy:
  selection_metric: val_ahi_pearson
  selection_mode: max
  selection_split: val
  final_eval_split: test
  external_test_locked: true
  test_after_fit: false
  require_manual_unlock_for_final_test: true
  final_test_unlocked: false

decisions:
  task:
    value: hparam_tune
    source: explicit_recipe
  label_name:
    value: ahi
    source: explicit_recipe
  external_test_locked:
    value: true
    source: explicit_recipe
  train_val_test_policy:
    value: val
    source: explicit_recipe
    rationale: Select hyper-parameters on validation evidence while external test access remains locked.
  test_after_fit:
    value: false
    source: explicit_recipe
  overwrite_policy:
    value: false
    source: explicit_recipe
  final_eval_unlock:
    value: false
    source: explicit_recipe
