name: ppg_ahi_val_tuning_example
task: hparam_tune
variant: sleep2vec

experiment:
  id: ASK_USER
  title: ASK_USER
  objective: ASK_USER
  root: ASK_USER
  baseline: ASK_USER
step:
  id: ASK_USER
  phase: train
  purpose: ASK_USER

base_recipe: finetune_ppg_ahi.yaml

# Starting example only: adjust the axes and points to the actual
# base/runtime config, prior evidence and compute authority before planning.
search:
  method: grid
  max_runs: 2
  # Exact points this plan runs: complete and unique.
  configurations:
    - runtime.lr: 1.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1
    - runtime.lr: 3.0e-6
      runtime.weight_decay: 1.0e-5
      runtime.epochs: 30
      yaml:/model/head/dropout: 0.1

artifacts:
  overwrite: false

evaluation_policy:
  selection_metric: val_ahi_pearson
  selection_mode: max
  selection_split: val
  final_eval_split: test
  external_test_locked: true
  test_after_fit: false
  require_manual_unlock_for_final_test: true
  final_test_unlocked: false

decisions:
  task:
    value: hparam_tune
    source: explicit_recipe
  label_name:
    value: ahi
    source: explicit_recipe
  external_test_locked:
    value: true
    source: explicit_recipe
  train_val_test_policy:
    value: val
    source: explicit_recipe
    rationale: Select hyper-parameters on validation evidence while external test access remains locked.
  test_after_fit:
    value: false
    source: explicit_recipe
  overwrite_policy:
    value: false
    source: explicit_recipe
  final_eval_unlock:
    value: false
    source: explicit_recipe
