name: style_check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: style_check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style_check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            .flake8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.3.1 flake8==7.1.1 isort==5.13.2

      - name: Run isort
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          isort --check-only .

      - name: Run black
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          black --check .

      - name: Run flake8
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          flake8 . --count --statistics

  agent_tools_typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-typecheck.txt
            pyproject.toml

      # Deliberately no torch/lightning/wandb: agent_tools must type-check in
      # the same domain-free environment the kernel test job already enforces.
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-typecheck.txt

      # Scope, settings, and the grandfathered debt ledger all live in
      # [tool.mypy] in pyproject.toml.
      - name: Run mypy
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mypy

      # The ledger may only shrink. Re-run with it neutralized and fail on any
      # entry whose module no longer has errors, so a cleaned-up module cannot
      # stay grandfathered. Mirrors test_agent_layering.test_every_exemption_is_live.
      - name: Check the mypy ledger for stale entries
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import tomli  # a mypy dependency on Python < 3.11

          document = Path("pyproject.toml").read_text(encoding="utf-8")
          ledger = sorted(
              module
              for override in tomli.loads(document)["tool"]["mypy"].get("overrides", [])
              if override.get("ignore_errors")
              for module in override["module"]
          )
          if not ledger:
              print("mypy ledger is empty; delete this step along with the last entry.")
              sys.exit(0)

          neutralized, count = re.subn(r"^ignore_errors = true$", "ignore_errors = false", document, flags=re.M)
          assert count == 1, f"expected exactly one ignore_errors toggle in pyproject.toml, found {count}"

          with tempfile.TemporaryDirectory() as tmp:
              config = Path(tmp) / "pyproject.toml"
              config.write_text(neutralized, encoding="utf-8")
              result = subprocess.run(
                  [sys.executable, "-m", "mypy", "--config-file", str(config), "--no-incremental", "agent_tools"],
                  capture_output=True,
                  text=True,
              )

          failing = set()
          for line in result.stdout.splitlines():
              match = re.match(r"^(agent_tools/[\w/]+)\.py:\d+: error:", line)
              if match:
                  parts = match[1].split("/")
                  failing.add(".".join(parts[:-1] if parts[-1] == "__init__" else parts))
          if not failing:
              print(result.stdout or result.stderr, file=sys.stderr)
              sys.exit("Neutralized mypy run reported no errors at all; the ledger check is not working.")

          stale = [module for module in ledger if module not in failing]
          if stale:
              print("Stale mypy ledger entries -- these modules type-check cleanly now.")
              print("Delete their lines from the [[tool.mypy.overrides]] block in pyproject.toml:")
              for module in stale:
                  print(f'    "{module}",')
              sys.exit(1)

          print(f"mypy ledger: {len(ledger)} grandfathered modules, none stale.")
          PY
