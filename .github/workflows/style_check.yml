name: style_check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: style_check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style_check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            .flake8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.3.1 flake8==7.1.1 isort==5.13.2

      - name: Run isort
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          isort --check-only .

      - name: Run black
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          black --check .

      - name: Run flake8
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          flake8 . --count --statistics

      # agent_tools only: the complexity ceiling, its suppression ledger, and
      # the embedded python -c programs flake8's directory walk cannot reach.
      # The same script backs `bash utils/style_check.sh`, so a clean local run
      # means a clean CI run.
      - name: Check agent_tools complexity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python utils/complexity_check.py

  agent_tools_typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-agent-tools.txt
            pyproject.toml

      # Shares the agent_tools tooling pins with the kernel and recipe test
      # jobs. Deliberately no torch/lightning/wandb: agent_tools must
      # type-check in the same domain-free environment those jobs enforce.
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent-tools.txt

      # mypy plus both directions of the ledger's shrink-only contract. The same
      # script backs `bash utils/style_check.sh`, so a clean local run means a
      # clean CI run; only the additions check differs, needing a base revision.
      - name: Type-check agent_tools
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          LEDGER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python utils/type_check.py
