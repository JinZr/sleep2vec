name: style_check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: style_check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style_check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            .flake8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.3.1 flake8==7.1.1 isort==5.13.2

      - name: Run isort
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          isort --check-only .

      - name: Run black
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          black --check .

      - name: Run flake8
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          flake8 . --count --statistics

  agent_tools_typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-agent-tools.txt
            pyproject.toml

      # Shares the agent_tools tooling pins with the kernel and recipe test
      # jobs. Deliberately no torch/lightning/wandb: agent_tools must
      # type-check in the same domain-free environment those jobs enforce.
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent-tools.txt

      # Scope, settings, and the grandfathered debt ledger all live in
      # [tool.mypy] in pyproject.toml.
      - name: Run mypy
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mypy

      # The ledger may only shrink, in both directions:
      #   * an entry added relative to the base revision is a new module opting
      #     out of type-checking, which the ratchet exists to prevent;
      #   * an entry whose module no longer reports errors is stale and must go.
      # Without the first check a contributor could introduce a type error and
      # silence it by appending its module here, and both the mypy run and the
      # staleness check would still pass.
      - name: Check the mypy ledger
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          LEDGER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import tomli  # a mypy dependency on Python < 3.11


          def ledger_of(document):
              """Grandfathered modules, or None if the revision has no mypy config."""
              mypy = tomli.loads(document).get("tool", {}).get("mypy")
              if mypy is None:
                  return None
              return {
                  module
                  for override in mypy.get("overrides", [])
                  if override.get("ignore_errors")
                  for module in override["module"]
              }


          document = Path("pyproject.toml").read_text(encoding="utf-8")
          ledger = ledger_of(document)
          assert ledger is not None, "pyproject.toml has no [tool.mypy] section"
          if not ledger:
              print("mypy ledger is empty; delete this step along with the last entry.")
              sys.exit(0)

          # 1. No additions relative to the base revision.
          base_sha = os.environ.get("LEDGER_BASE_SHA", "").strip()
          base_document = None
          if base_sha and set(base_sha) != {"0"}:
              show = subprocess.run(
                  ["git", "show", f"{base_sha}:pyproject.toml"], capture_output=True, text=True
              )
              if show.returncode == 0:
                  base_document = show.stdout
              else:
                  print(f"Could not read pyproject.toml at {base_sha}; skipping the additions check.")
          else:
              print("No base revision for this event; skipping the additions check.")

          if base_document is not None:
              base_ledger = ledger_of(base_document)
              if base_ledger is None:
                  print("Base revision has no [tool.mypy]; this change introduces the ledger.")
              else:
                  added = sorted(ledger - base_ledger)
                  if added:
                      print("The mypy ledger may only shrink, and these entries are new:")
                      for module in added:
                          print(f'    "{module}",')
                      print()
                      print("Fix the module\'s type errors instead of grandfathering it.")
                      sys.exit(1)
                  print(f"mypy ledger: no additions against {base_sha[:12]}.")

          # 2. No stale entries: every grandfathered module must still have errors.
          neutralized, count = re.subn(r"^ignore_errors = true$", "ignore_errors = false", document, flags=re.M)
          assert count == 1, f"expected exactly one ignore_errors toggle in pyproject.toml, found {count}"

          with tempfile.TemporaryDirectory() as tmp:
              config = Path(tmp) / "pyproject.toml"
              config.write_text(neutralized, encoding="utf-8")
              result = subprocess.run(
                  [sys.executable, "-m", "mypy", "--config-file", str(config), "--no-incremental", "agent_tools"],
                  capture_output=True,
                  text=True,
              )

          failing = set()
          for line in result.stdout.splitlines():
              match = re.match(r"^(agent_tools/[\w/]+)\.py:\d+: error:", line)
              if match:
                  parts = match[1].split("/")
                  failing.add(".".join(parts[:-1] if parts[-1] == "__init__" else parts))
          if not failing:
              print(result.stdout or result.stderr, file=sys.stderr)
              sys.exit("Neutralized mypy run reported no errors at all; the ledger check is not working.")

          stale = sorted(module for module in ledger if module not in failing)
          if stale:
              print("Stale mypy ledger entries -- these modules type-check cleanly now.")
              print("Delete their lines from the [[tool.mypy.overrides]] block in pyproject.toml:")
              for module in stale:
                  print(f'    "{module}",')
              sys.exit(1)

          print(f"mypy ledger: {len(ledger)} grandfathered modules, none stale.")
          PY
