task_defaults:
  finetune:
    test_after_fit:
      value: true
      source: policy_default
      meaning: Run the configured test split after fit unless the recipe or user explicitly opts out.
  hparam_tune:
    test_after_fit:
      value: true
      source: policy_default
      meaning: Run the configured test split after each trial unless the recipe or user explicitly opts out.

high_impact_fields:
  - id: task
    required_for_tasks: ["preset_prepare", "finetune", "infer", "evaluate", "hparam_tune", "sleep2stat", "embedding_extraction"]
    question: "Which task should be performed: preset_prepare, finetune, infer, evaluate, hparam_tune, sleep2stat, or embedding_extraction?"

  - id: config
    required_for_tasks: ["finetune", "infer", "evaluate", "embedding_extraction"]
    question: "Which model config should this task use?"

  - id: label_name
    required_for_tasks: ["finetune", "infer", "evaluate", "hparam_tune"]
    question: "Which label should this task use, for example ahi, age, sex, stage5, or a custom metadata label?"

  - id: data_backend
    required_for_tasks: ["finetune", "infer", "evaluate"]
    question: "Should this run use npz/preset data or Kaldi manifest data?"

  - id: train_val_test_policy
    required_for_tasks: ["finetune", "hparam_tune"]
    question: "Which supported split should be used for model selection: val for direct finetune; val or explicitly authorized test for hparam tuning?"

  - id: external_test_locked
    required_for_tasks: ["hparam_tune"]
    question: "Should test data remain locked during this task, or is test access explicitly authorized?"

  - id: selection_metric
    required_for_tasks: ["finetune", "hparam_tune"]
    question: "Which metric should be used to select the best checkpoint or best run?"

  - id: selection_mode
    required_for_tasks: ["finetune", "hparam_tune"]
    allowed_values: ["min", "max"]
    question: "Should the selection metric be minimized or maximized?"

  - id: pretrained_backbone_path
    required_for_tasks: ["finetune"]
    question: "Should this run initialize from a pretrained backbone checkpoint? If yes, which path should be used?"

  - id: ckpt_path
    required_for_tasks: ["infer", "evaluate", "embedding_extraction"]
    question: "Which checkpoint path should be used for inference/evaluation?"

  - id: eval_split
    required_for_tasks: ["infer", "evaluate", "embedding_extraction"]
    allowed_values: ["train", "val", "test"]
    question: "Which split should be evaluated: train, val, or test?"

  - id: preset_regeneration
    required_for_tasks: ["preset_prepare"]
    question: "Should existing preset files be reused or regenerated?"

  - id: overwrite_policy
    required_for_tasks: ["preset_prepare", "finetune", "hparam_tune", "infer", "evaluate", "sleep2stat", "embedding_extraction"]
    question: "Is overwriting existing output files allowed for this task?"

  - id: sleep2stat_split_policy
    required_for_tasks: ["sleep2stat"]
    question: "Which split(s) should sleep2stat process, and are outputs restricted to descriptive alignment/statistics rather than threshold or cleaning-rule selection?"

  - id: sleep2stat_metric_use_policy
    required_for_tasks: ["sleep2stat"]
    question: "Should model-derived metrics such as predicted AHI, ODI, or hypoxic-burden-like summaries be treated as proxy metrics unless clinical annotations are configured?"

  - id: required_channels
    required_for_tasks: ["preset_prepare", "finetune"]
    question: "Which channels are required, and which channels are optional?"

  - id: min_channels
    required_for_tasks: ["preset_prepare"]
    question: "If missing channels are allowed, what is the minimum number of channels that each sample must contain?"

  - id: embedding_channels
    required_for_tasks: ["embedding_extraction"]
    question: "Which model channels should be exported?"

  - id: embedding_kind
    required_for_tasks: ["embedding_extraction"]
    question: "Should whole-night extraction export both token and CLS embeddings?"

  - id: layer_index
    required_for_tasks: ["embedding_extraction"]
    question: "Which encoder layer should supply embeddings?"

  - id: max_source_tokens
    required_for_tasks: ["embedding_extraction"]
    question: "What is the maximum whole-night source-token count?"

  - id: output_format
    required_for_tasks: ["embedding_extraction"]
    question: "Which embedding output format should be used?"

  - id: sequence_mode
    required_for_tasks: ["embedding_extraction"]
    question: "Which extraction sequence mode should be used?"

  - id: hparam_search_space
    required_for_tasks: ["hparam_tune"]
    question: "Which hyper-parameters and values should be searched?"

  - id: hparam_budget
    required_for_tasks: ["hparam_tune"]
    question: "What is the maximum number of runs or compute budget for this search?"

  - id: final_eval_unlock
    required_for_tasks: ["hparam_tune", "evaluate"]
    question: "Should the selected model now be evaluated on the external test set?"
