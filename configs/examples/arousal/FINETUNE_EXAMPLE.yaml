# Built-in task example: --label-name arousal
# Clinical reference: the NPZ raster must already be source-scored; this task cannot verify the >=3 s abrupt EEG
# frequency shift after >=10 s continuous sleep or the REM >=1 s chin-EMG increase. See
# https://isr.aasm.org/helpv5/ScoringArousalsA.html and https://doi.org/10.1093/sleep/15.2.173.
# Source contract: RES/SPONT/Limb/PLM is the exporter taxonomy, not a universal AASM four-subtype definition.
# Task contract: `arousal` is a 1 Hz multi-hot target in fixed [RES, SPONT, Limb, PLM] order. Each 30-second
# token is flattened second-major, subtype-minor to 30 x 4 = 120 logits; stage5 never masks the target.
# Evaluation contract: the primary validation metric is val_arousal_subtype_macro_event_f1.
model:
  backbone:
    name: roformer
    hidden_size: 128
    num_hidden_layers: 4
    num_attention_heads: 4
    vocab_size: 1
    config_overrides: {}
  projection:
    name: simclr
    enabled: true
    hidden_dim: 128
    out_dim: 64
    kwargs: {}
  cls:
    embedding_type: bert
    downstream: tokens
    kwargs: {}
  channels:
    - name: heartbeat
      alias: psg_heartbeat
      input_dim: 120
      tokenizer:
        name: sundial
        out_dim: 128
        kwargs: {}
    - name: breath
      alias: psg_breath
      input_dim: 120
      tokenizer:
        name: sundial
        out_dim: 128
        kwargs: {}
  head:
    name: temporal_conv
    hidden_dim: 128
    dropout: 0.1
    act: elu
    channel_agg:
      name: gated_scalar
      kwargs: {}
    temporal_agg:
      name: mean
      kwargs: {}
    kwargs:
      temporal_layers: 3
      temporal_kernel: 7
      temporal_dilation_base: 2
      temporal_dropout: 0.1
data:
  backend: npz
  kaldi_data_root: null
  kaldi_manifest: null
  max_tokens: 120
  data_channel_names: [heartbeat, breath]
  finetune_data_index: index/example_finetune.csv
  finetune_preset_path: null
  train_dataset_names: []
  test_dataset_names: []
  n_few_shot: 1280
finetune:
  tuning:
    preset: full
    groups:
      tokenizers: {train: false}
  loss:
    class_weights: null
    pos_weight: 1.0
  sampler:
    weighted_random: false
  layer_mix:
    enabled: false
    shared_across_modalities: false
    layer_indices: null
  task:
    type: classification
    output_dim: 120
    is_seq: true
    monitor: val_arousal_subtype_macro_event_f1
    monitor_mod: max
  eval_visualizations:
    enabled: false
    stages: [val, test]
    confusion_matrix:
      enabled: false
      show_raw_counts: false
    roc_curve:
      enabled: false
    regression_scatter:
      enabled: false
preset_build:
  required_channels: [heartbeat, breath, arousal, stage5]
  min_channels: 4
model_averaging:
  name: ema
  params:
    enabled: true
    base_momentum: 0.996
    final_momentum: 1.0
    use_for_eval: true
