model:
  name: sex_age_mlp
  head:
    name: classification
    hidden_dim: 32
    dropout: 0.1
    act: elu
    kwargs:
      num_layers: 3

data:
  # The matching signal run's index, preset or Kaldi manifest; rows collapse to one record per key_column value.
  backend: npz
  finetune_data_index: null
  finetune_preset_path: null
  kaldi_data_root: null
  kaldi_manifest: null
  train_dataset_names: []
  test_dataset_names: []

finetune:
  task:
    type: multilabel_classification
    output_dim: 1086
    is_seq: false
    monitor: val_macro_auroc
    monitor_mod: max
  multilabel:
    key_column: eid
    disease_columns_index: /path/to/disease_columns.txt
    label_index: /path/to/disease_label.csv
    has_label_index: /path/to/has_label.csv
    covariates: [age, sex]
    covariate_embedding_dim: 16
    # BMI needs bmi and bmi_missing columns in the shared index or preset, plus frozen training-split statistics:
    # covariates: [age, sex, bmi, bmi_missing]
    # covariate_normalization:
    #   bmi: {mean: <train mean>, std: <train std>}
  loss:
    pos_weight: null
