model:
  name: sex_age_mlp
  features: [age, sex]
  age:
    transform: divide
    scale: 100.0
    embedding_dim: 16
    initialization: zeros
  sex:
    encoding: binary
    embedding_dim: 16
    initialization: zeros
  head:
    name: classification
    hidden_dim: 32
    dropout: 0.1
    act: elu
    kwargs:
      num_layers: 3

data:
  backend: npz
  finetune_data_index: /path/to/index.csv
  finetune_preset_path: null
  kaldi_data_root: null
  kaldi_manifest: null
  split_column: split
  key_column: eid
  deduplicate_by_key: true

finetune:
  loss:
    eps: 1.0e-9
  task:
    type: survival
    output_dim: 177
    is_seq: false
    monitor: val_c_index
    monitor_mod: max
  survival:
    key_column: eid
    disease_columns_index: /path/to/disease_columns.txt
    event_time_index: /path/to/event_time.csv
    is_event_index: /path/to/is_event.csv
    has_label_index: /path/to/has_label.csv

outputs:
  prediction_csv: true
  per_disease_metrics_csv: true
